<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IdeaGen High-Level Architecture (Public)</title>
  <style>
    @page { size: Letter landscape; margin: 0.35in; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: #0f172a;
      background: #f1f5f9;
    }
    .wrap {
      max-width: 1400px;
      margin: 20px auto;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px;
    }
    .diagram {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
    .note {
      margin: 10px 4px 0;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img
      class="diagram"
      src="./architecture_diagram_high_level_public.svg"
      alt="IdeaGen high-level architecture public diagram"
    />
    <p class="note">Public version for recruiter and portfolio review. Internal file-level details are intentionally omitted.</p>
  </main>
</body>
</html>
