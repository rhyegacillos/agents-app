name: CI

on:
  push:
    branches: [digital-assistant-terraform]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify generated architecture facts
        run: python scripts/render_architecture_facts.py --check

      - name: Run backend tests
        working-directory: ./backend
        run: uv run python -m unittest discover -s tests -p "test_*.py"

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t digital-assistant-ci:${{ github.sha }} \
            ./backend

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    environment: ${{ github.event.inputs.environment || 'prod' }}
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'prod' }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'digital-assistant' }}
      DEFAULT_RUNTIME_SECRETS_ARN: ${{ vars.RUNTIME_SECRETS_ARN || '' }}
      DEV_RUNTIME_SECRETS_ARN: ${{ vars.DEV_RUNTIME_SECRETS_ARN || '' }}
      TEST_RUNTIME_SECRETS_ARN: ${{ vars.TEST_RUNTIME_SECRETS_ARN || '' }}
      PROD_RUNTIME_SECRETS_ARN: ${{ vars.PROD_RUNTIME_SECRETS_ARN || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy
          aws-region: ${{ secrets.DEFAULT_AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve Runtime Secret ARN
        id: runtime_secret_config
        run: |
          case "$DEPLOY_ENV" in
            dev)
              runtime_secrets_arn="${DEV_RUNTIME_SECRETS_ARN:-}"
              ;;
            test)
              runtime_secrets_arn="${TEST_RUNTIME_SECRETS_ARN:-}"
              ;;
            prod)
              runtime_secrets_arn="${PROD_RUNTIME_SECRETS_ARN:-}"
              ;;
            *)
              echo "Unsupported DEPLOY_ENV: $DEPLOY_ENV" >&2
              exit 1
              ;;
          esac

          if [ -z "$runtime_secrets_arn" ]; then
            runtime_secrets_arn="${DEFAULT_RUNTIME_SECRETS_ARN:-}"
          fi

          test -n "$runtime_secrets_arn"
          echo "runtime_secrets_arn=$runtime_secrets_arn" >> "$GITHUB_OUTPUT"

      - name: Sync Runtime Secrets
        id: runtime_secret
        run: |
          chmod +x scripts/runtime_secret.sh
          runtime_secrets_arn="$(./scripts/runtime_secret.sh sync "$DEPLOY_ENV" "$PROJECT_NAME")"
          test -n "$runtime_secrets_arn"
          echo "runtime_secrets_arn=$runtime_secrets_arn" >> "$GITHUB_OUTPUT"
        env:
          APP_NAME: ${{ env.PROJECT_NAME }}
          RUNTIME_SECRETS_ARN: ${{ steps.runtime_secret_config.outputs.runtime_secrets_arn }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_LOGS_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_HEADERS }}

      - name: Run Deployment Script
        run: |
          export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          export DEFAULT_AWS_REGION=${{ secrets.DEFAULT_AWS_REGION }}
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh "$DEPLOY_ENV"
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          APP_NAME: ${{ env.PROJECT_NAME }}
          RUNTIME_SECRETS_ARN: ${{ steps.runtime_secret.outputs.runtime_secrets_arn }}
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          TF_BACKEND_DDB_TABLE: ${{ vars.TF_BACKEND_DDB_TABLE }}
          TF_VAR_grok_api_url: ${{ secrets.GROK_API_URL }}
          TF_VAR_grok_model_id: ${{ secrets.GROK_MODEL_ID }}
          TF_VAR_ai_provider: bedrock
          TF_VAR_bedrock_model_id: ${{ vars.BEDROCK_MODEL_ID }}
          TF_VAR_default_aws_region: ${{ secrets.DEFAULT_AWS_REGION }}
          TF_VAR_runtime_secrets_arn: ${{ steps.runtime_secret.outputs.runtime_secrets_arn }}
          TF_VAR_async_chat_enabled: ${{ vars.ASYNC_CHAT_ENABLED }}

      - name: Get Deployment URLs
        id: deploy_outputs
        working-directory: ./terraform
        run: |
          terraform workspace select "$DEPLOY_ENV"
          echo "cloudfront_url=$(terraform output -raw cloudfront_url)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(terraform output -raw s3_frontend_bucket)" >> "$GITHUB_OUTPUT"

      - name: Run E2E Evals (Golden Set)
        timeout-minutes: 10
        run: |
          python3 backend/evals/run_evals.py \
            --api-url "${{ steps.deploy_outputs.outputs.api_url }}" \
            --user-id "evaluser1234" \
            --golden "backend/evals/golden.jsonl" \
            --out "eval_results.json"

      - name: Upload Eval Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ env.DEPLOY_ENV }}
          path: eval_results.json

      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?DomainName=='${{ steps.deploy_outputs.outputs.frontend_bucket }}.s3-website-${{ secrets.DEFAULT_AWS_REGION }}.amazonaws.com']].Id | [0]" \
            --output text)

          if [ "$DISTRIBUTION_ID" != "None" ] && [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
          fi

      - name: Deployment Summary
        run: |
          echo "CloudFront URL: ${{ steps.deploy_outputs.outputs.cloudfront_url }}"
          echo "API Gateway: ${{ steps.deploy_outputs.outputs.api_url }}"
          echo "Frontend Bucket: ${{ steps.deploy_outputs.outputs.frontend_bucket }}"
