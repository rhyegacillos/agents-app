name: Destroy AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - test
          - prod
      confirm:
        description: "Type DESTROY to continue"
        required: true
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'prod' && 'ideagen-prod' || github.event.inputs.environment }}

    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment }}
      TFVARS_FILE: terraform/${{ github.event.inputs.environment }}.tfvars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment var-file
        id: tfvars_meta
        run: |
          echo "::group::Validate environment var-file"
          echo "Destroy environment: ${DEPLOY_ENV}"
          echo "Terraform var-file: ${TFVARS_FILE}"
          chmod +x scripts/read_tfvars_value.sh
          test -f "${TFVARS_FILE}"
          tfvars_env="$(./scripts/read_tfvars_value.sh "${TFVARS_FILE}" environment)"
          tfvars_project_name="$(./scripts/read_tfvars_value.sh "${TFVARS_FILE}" project_name)"
          tfvars_aws_region="$(./scripts/read_tfvars_value.sh "${TFVARS_FILE}" aws_region)"
          echo "Var-file environment: ${tfvars_env}"
          echo "Var-file project_name: ${tfvars_project_name}"
          echo "Var-file aws_region: ${tfvars_aws_region}"
          test "${tfvars_env}" = "${DEPLOY_ENV}"
          test -n "${tfvars_project_name}"
          test -n "${tfvars_aws_region}"
          echo "project_name=${tfvars_project_name}" >> "${GITHUB_OUTPUT}"
          echo "aws_region=${tfvars_aws_region}" >> "${GITHUB_OUTPUT}"
          echo "::endgroup::"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.tfvars_meta.outputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Run destroy
        run: |
          echo "::group::Destroy Terraform environment"
          chmod +x scripts/destroy.sh
          ./scripts/destroy.sh "${DEPLOY_ENV}" --tfvars-file "${TFVARS_FILE}" --project-name "${{ steps.tfvars_meta.outputs.project_name }}" --region "${{ steps.tfvars_meta.outputs.aws_region }}"
          echo "::endgroup::"

  confirm_failed:
    if: ${{ github.event.inputs.confirm != 'DESTROY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail confirmation
        run: |
          echo "Confirmation failed. Re-run the workflow and type DESTROY exactly." >&2
          exit 1
