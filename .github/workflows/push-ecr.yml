name: Push Image To ECR

on:
  workflow_dispatch:
  # Intentionally not triggered on push.
  # The deploy workflow builds+pushes as part of a single sequential pipeline.

permissions:
  id-token: write
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC, Trader Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Dedicated role for this app (do not reuse global AWS_ROLE_ARN from other repos/apps).
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TRADER }}
          aws-region: ${{ secrets.DEFAULT_AWS_REGION }}

      - name: Verify Assumed AWS Identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws configure get region

      - name: Login To ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build And Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=
